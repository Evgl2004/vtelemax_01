[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtelemax"
version = "0.1.0"
description = "Монорепозиторий единого ядра для Telegram/VK/MAX ботов"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "vtelemax team" }
]
dependencies = [
    "aiohttp>=3.11,<4.0",
    "asyncpg>=0.30,<1.0",
    "loguru>=0.7,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "qrcode[pil]>=8.2,<9.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "tenacity>=9.0,<10.0"
]

[project.optional-dependencies]
telegram = [
    "aiogram==3.20.0.post0"
]
vk = [
    "vkbottle>=4.4.0,<5.0.0"
]
max = [
    "maxapi==0.9.16"
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.11,<0.12"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
