name: vtelemax

services:
  xray-telegram:
    image: ghcr.io/xtls/xray-core:26.3.27
    volumes:
      - /etc/vtelemax/xray-telegram:/usr/local/etc/xray:ro
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-confdir", "/usr/local/etc/xray"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: vtelemax-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vtelemax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: python scripts/apply_sql_migrations.py
    restart: "no"

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TELEGRAM_PROXY_URL: http://xray-telegram:10809
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      xray-telegram:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.telegram_app
    restart: unless-stopped

  vk-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.vk_app
    restart: unless-stopped

  vk-phone-verification-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.vk_phone_verification_service_app
    expose:
      - "${VK_PHONE_VERIFICATION_SERVICE_PORT:-8085}"
    restart: unless-stopped

  sagur-integration-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.sagur_integration_api_app
    expose:
      - "${SAGUR_INTEGRATION_SERVICE_PORT:-8086}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - vk-phone-verification-service
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-sobalbot.24vds.ru}
      NGINX_CONFIG_CHECK_INTERVAL_SECONDS: ${NGINX_CONFIG_CHECK_INTERVAL_SECONDS:-300}
      SAGUR_INTEGRATION_IP_ALLOWLIST: ${SAGUR_INTEGRATION_IP_ALLOWLIST:-}
      SAGUR_INTEGRATION_RATE_LIMIT_RPM: ${SAGUR_INTEGRATION_RATE_LIMIT_RPM:-60}
      SAGUR_INTEGRATION_SERVICE_PORT: ${SAGUR_INTEGRATION_SERVICE_PORT:-8086}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/vk-miniapp.conf:/etc/nginx/templates/vk-miniapp-http.conf:ro
      - ./deploy/nginx/vk-miniapp-tls.conf:/etc/nginx/templates/vk-miniapp-tls.conf:ro
      - ./deploy/nginx/nginx-miniapp-entrypoint.sh:/opt/nginx-miniapp-entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    command: /bin/sh /opt/nginx-miniapp-entrypoint.sh
    restart: unless-stopped

  certbot-init:
    image: certbot/certbot:latest
    profiles: ["tls-init"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        certbot certonly --webroot -w /var/www/certbot \
          -d ${TLS_DOMAIN:-sobalbot.24vds.ru} \
          --email ${TLS_EMAIL:-admin@sobalbot.24vds.ru} \
          --agree-tos --no-eff-email --non-interactive --rsa-key-size 4096
    restart: "no"

  certbot-renew:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h;
        done
    restart: unless-stopped

  max-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.max_app
    restart: unless-stopped

  telegram-delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TELEGRAM_PROXY_URL: http://xray-telegram:10809
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      xray-telegram:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.moderation_delivery_worker_app --platform telegram
    restart: unless-stopped

  vk-delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.moderation_delivery_worker_app --platform vk
    restart: unless-stopped

  max-delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.moderation_delivery_worker_app --platform max
    restart: unless-stopped

  profile-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.profile_sync_worker_app
    restart: unless-stopped

  sagur-registration-events-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: python -m vtelemax.apps.sagur_registration_events_worker_app
    restart: unless-stopped

volumes:
  vtelemax_postgres_data:
  certbot_www:
  certbot_conf:
