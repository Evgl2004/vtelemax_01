server_tokens off;

limit_req_zone $binary_remote_addr zone=miniapp_api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=miniapp_conn:10m;

upstream vk_miniapp_backend {
    server vk-phone-verification-service:8085;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ACME challenge for certbot http-01.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Only VK Mini App and its API are exposed.
    location = /vk/miniapp {
        limit_req zone=miniapp_api_rate burst=20 nodelay;
        limit_conn miniapp_conn 20;

        proxy_http_version 1.1;
        proxy_pass http://vk_miniapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # VK Mini App is rendered inside VK surfaces; do not use X-Frame-Options: DENY here.
        add_header Content-Security-Policy "default-src 'self' https://unpkg.com https://vk.com https://*.vk.com https://*.vk-apps.com; connect-src 'self' https://vk.com https://*.vk.com https://*.vk-apps.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' https://unpkg.com; frame-ancestors https://vk.com https://*.vk.com https://*.vk-apps.com;" always;
    }

    location = /api/v1/vk/miniapp/session/start {
        limit_req zone=miniapp_api_rate burst=20 nodelay;
        limit_conn miniapp_conn 20;

        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_pass http://vk_miniapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    location = /api/v1/vk/miniapp/session/phone {
        limit_req zone=miniapp_api_rate burst=20 nodelay;
        limit_conn miniapp_conn 20;

        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_pass http://vk_miniapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Must not be public. vk-bot reads status directly from internal Docker network.
    location = /api/v1/vk/miniapp/session/status {
        return 403;
    }

    location = /health {
        proxy_http_version 1.1;
        proxy_pass http://vk_miniapp_backend;
    }

    # Deny any other route on this proxy.
    location / {
        return 404;
    }
}
